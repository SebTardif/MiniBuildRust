name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Publish to api.scorecard.dev is flaky. Keep the SARIF when analysis
      # wrote it. Fail only when results.sarif is still empty after one retry.
      - name: Run Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retry Scorecard after empty results
        id: scorecard_retry
        if: hashFiles('results.sarif') == ''
        continue-on-error: true
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail if Scorecard produced no results
        if: hashFiles('results.sarif') == ''
        env:
          FIRST: ${{ steps.scorecard.outcome }}
          RETRY: ${{ steps.scorecard_retry.outcome }}
        run: |
          echo "Scorecard analysis did not write results.sarif after one retry"
          echo "first outcome=${FIRST} retry outcome=${RETRY}"
          exit 1
      - name: Upload SARIF
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
