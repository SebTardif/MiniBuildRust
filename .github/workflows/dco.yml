name: DCO

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dco:
    name: DCO Sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
        run: bash scripts/check-dco.sh
